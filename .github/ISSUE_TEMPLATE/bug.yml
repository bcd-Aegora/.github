name: Bug
description: Report reproducible incorrect behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact / security relevance

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
